# Fixed hosted Sentinel supervisor.
#
# This workflow is dispatched at the immutable protected source ref by
# supervisor-dispatch.yml. The environment branch policy permits the App key
# only for this ref. No candidate checkout, repair token or model credential
# enters this job.
name: sentinel-supervisor

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-supervisor
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/sentinel-supervisor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: sentinel-supervisor
    steps:
      - name: Checkout protected supervisor source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Mint the scoped supervisor installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liB8E2FcIZd9i7Pg
          private-key: ${{ secrets.SENTINEL_SUPERVISOR_APP_PRIVATE_KEY }}
          owner: ubiquity
          repositories: sentinel
          permission-contents: write
      - name: Verify scoped token handoff
        env:
          SENTINEL_SUPERVISOR_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [[ -z "$SENTINEL_SUPERVISOR_TOKEN" ]]; then
            echo "supervisor token handoff is missing"
            exit 1
          fi
          token_length=${#SENTINEL_SUPERVISOR_TOKEN}
          if (( token_length < 20 || token_length > 256 )); then
            echo "supervisor token handoff has invalid length: ${token_length}"
            exit 1
          fi
          echo "supervisor token handoff present (length ${token_length})"
      - name: Seed release state through the supervisor
        env:
          SENTINEL_SUPERVISOR_TOKEN: ${{ steps.app-token.outputs.token }}
        run: deno task supervisor:run
