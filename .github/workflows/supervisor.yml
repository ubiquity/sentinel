# Fixed hosted Sentinel supervisor.
#
# Dispatched at the immutable protected source ref by supervisor-dispatch.yml
# (five-minute cadence) and by repair.yml (hourly/manual). prepare and finalize
# run under the sentinel-supervisor environment, which alone may read the App
# private key; the repair job runs the selected runtime with no App credential
# and starts no model for verification executions.
name: sentinel-supervisor

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sentinel-supervisor
  cancel-in-progress: false

jobs:

  # One-shot issue-48 review-quota recovery. It holds the existing
  # sentinel-repair lock (the same group the repair job uses) and runs before
  # prepare under the protected ref, so no scheduled legacy run can race it; it
  # never installs or starts a model and uses only the repository github.token.
  maintenance:
    if: github.ref == 'refs/heads/sentinel-supervisor'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: sentinel-supervisor
    # `issues: write` is what the autonomy pass needs to close an issue once its
    # exact reviewed head has an ACCEPTED hosted release, and `actions: write`
    # is what it needs to approve the credential-free deterministic check that
    # GitHub parks for a bot-authored pull request.
    permissions:
      contents: write
      pull-requests: write
      checks: read
      issues: write
      actions: write
    concurrency:
      group: sentinel-repair
      cancel-in-progress: false
    steps:
      - name: Checkout protected supervisor source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          # Full history so the helper can bind the actual checked-out HEAD to
          # the dispatched GITHUB_SHA.
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # Bounded self-upkeep, run before prepare under the repair lock so its
      # state changes are visible to this run's own execution:
      #   1. a record blocked by a TRANSIENT model-run failure is retried with
      #      the smallest closed counter grant that makes its next admission an
      #      unused reservation identity below the runtime's own attempt
      #      ceiling (or with the runtime's base-refresh intent when every
      #      identity at the current base is charged), at most
      #      HOSTED_AUTONOMY_MAX_RETRIES (200) grants per task, counted in the
      #      task's durable reservations (every purpose, including one still
      #      reserved); the preserved `retries` counter is history and is never
      #      incremented or reset;
      #   2. a record whose exact reviewed head carries a completed receipt with
      #      no unresolved P0/P1 and a successful deterministic check is
      #      delivered end to end: the expected-head merge is performed with a
      #      compare-and-swap (the runtime's own merge port refuses while this
      #      deployment's `development` ruleset carries no active
      #      `pull_request` rule, which the owner removed and ordered not to
      #      restore) and the exact release request the runtime's delivery step
      #      would have written is recorded for the trusted supervisor, which
      #      still owns proofs, promotion, acceptance and rollback. It writes
      #      no review, receipt, proof or acceptance, is idempotent, and exits
      #      zero on every non-applied outcome.
      - name: Mint the scoped sentinel App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liHUJNXds9mU3j7Q
          private-key: ${{ secrets.SENTINEL_SUPERVISOR_APP_PRIVATE_KEY }}
          owner: ubiquity
          # Every committed target repository the App installation covers. The
          # installation is `repository_selection: all`, but this action still
          # narrows the minted token to the listed names, and a narrowed token
          # is refused with 403 on any repository it does not list. Listing only
          # `sentinel` made every ai.ubq.fi write impossible, which is why no
          # ai.ubq.fi issue could ever be repaired or closed.
          repositories: sentinel,ai.ubq.fi
      - name: Run hosted autonomy (retry transient failures, deliver reviewed heads)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTINEL_SUPERVISOR_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          deno run --no-lock
          --allow-read
          --allow-write
          --allow-run=git
          --allow-net=api.github.com
          --allow-env=HOME,PATH,GITHUB_TOKEN,SENTINEL_SUPERVISOR_TOKEN,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_SHA,GITHUB_WORKFLOW_SHA,GITHUB_WORKFLOW_REF,GITHUB_JOB
          ops/hosted-autonomy.ts

  prepare:
    needs: maintenance
    if: always() && github.ref == 'refs/heads/sentinel-supervisor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The one-shot owner installation reads the fixed runtime revision's
    # ancestry and its completed `test-local` check with the repository token
    # before any state commit is created.
    permissions:
      contents: read
      actions: read
      checks: read
    environment:
      name: sentinel-supervisor
    outputs:
      run: ${{ steps.prepare.outputs.run }}
      revision: ${{ steps.prepare.outputs.revision }}
    steps:
      - name: Checkout protected supervisor source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Mint the scoped supervisor installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liHUJNXds9mU3j7Q
          private-key: ${{ secrets.SENTINEL_SUPERVISOR_APP_PRIVATE_KEY }}
          owner: ubiquity
          # Every committed target repository the App installation covers. The
          # installation is `repository_selection: all`, but this action still
          # narrows the minted token to the listed names, and a narrowed token
          # is refused with 403 on any repository it does not list. Listing only
          # `sentinel` made every ai.ubq.fi write impossible, which is why no
          # ai.ubq.fi issue could ever be repaired or closed.
          repositories: sentinel,ai.ubq.fi
          permission-contents: write
      # One-shot fixed owner-authorized development installation. It reads and
      # validates the complete release state with the App token, verifies the
      # next fixed runtime revision with the repository token, and creates its
      # own explicitly owner-authorized state commit before the ordinary
      # prepare run. It starts no model and prints no credential.
      - name: Install owner-authorized development runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTINEL_SUPERVISOR_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          deno run --no-lock
          --allow-read
          --allow-write
          --allow-run=git
          --allow-net=api.github.com
          --allow-env=HOME,PATH,GITHUB_TOKEN,SENTINEL_SUPERVISOR_TOKEN,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_SHA,GITHUB_WORKFLOW_SHA,GITHUB_JOB
          src/host/owner-development-install.ts
      - name: Prepare hosted supervisor run
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTINEL_SUPERVISOR_TOKEN: ${{ steps.app-token.outputs.token }}
        run: deno task supervisor:run

  repair:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && github.ref == 'refs/heads/sentinel-supervisor' && needs.prepare.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    # 55 minutes. The job starts before the scoped App installation token is
    # minted below, so this bound covers checkout, setup and preparation plus
    # the launcher child (50-minute deadline) and still ends inside the token's
    # 60-minute lifetime. The token is used exactly as minted: no renewal.
    timeout-minutes: 55
    environment:
      name: sentinel-supervisor
    permissions:
      contents: write
      actions: write
      issues: write
      pull-requests: write
      checks: read
      statuses: read
    concurrency:
      group: sentinel-repair
      cancel-in-progress: false
    steps:
      - name: Checkout protected launcher source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: launcher
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout selected runtime source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          path: runtime
          # Full history: a depth-1 checkout keeps a shallow boundary through
          # the local copy and makes the base-refresh merge see no ancestor.
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install pinned Codex app-server
        run: npm install --global @openai/codex@0.154.0
      # GitHub-hosted Linux runners need unprivileged user namespaces for
      # bubblewrap; same handling as openai/codex-action action.yml 289-315:
      # https://github.com/openai/codex-action/blob/main/action.yml
      # Ephemeral runner only; no model profile or host setting changes.
      - name: Enable Linux user namespaces for bubblewrap
        continue-on-error: true
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          current_userns=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Mint the scoped sentinel App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liHUJNXds9mU3j7Q
          private-key: ${{ secrets.SENTINEL_SUPERVISOR_APP_PRIVATE_KEY }}
          owner: ubiquity
          # Every committed target repository the App installation covers. The
          # installation is `repository_selection: all`, but this action still
          # narrows the minted token to the listed names, and a narrowed token
          # is refused with 403 on any repository it does not list. Listing only
          # `sentinel` made every ai.ubq.fi write impossible, which is why no
          # ai.ubq.fi issue could ever be repaired or closed.
          repositories: sentinel,ai.ubq.fi
      - name: Run selected Sentinel runtime
        working-directory: launcher
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTINEL_SUPERVISOR_TOKEN: ${{ steps.app-token.outputs.token }}
          UOS_AI_TOKEN: ${{ secrets.UOS_AI_TOKEN }}
          # Installation scope of the `ubiquity-sentinel` App. A scope key, not
          # a secret: every committed target except the sentinel self-repository
          # is repaired under this one App installation, while the sentinel
          # self-target keeps the reserved no-App scope 0.
          SENTINEL_APP_INSTALLATION_ID: "155687488"
          # Model route. Repository/environment vars supply the primary and
          # fallback route; the DeepSeek key is the documented once-per-run
          # fallback credential. Blank optional vars stay blank and the
          # launcher forwards only nonempty values, so an unset var keeps the
          # existing resolver behavior. The App private key is never bound here.
          SENTINEL_MODEL_BASE_URL: ${{ vars.SENTINEL_MODEL_BASE_URL }}
          SENTINEL_MODEL_ID: ${{ vars.SENTINEL_MODEL_ID }}
          SENTINEL_MODEL_FALLBACK: ${{ vars.SENTINEL_MODEL_FALLBACK }}
          SENTINEL_DEEPSEEK_API_KEY: ${{ secrets.SENTINEL_DEEPSEEK_API_KEY }}
        run: >-
          deno run
          --allow-read
          --allow-write
          --allow-run
          --allow-net="api.github.com,*.blob.core.windows.net"
          --allow-env=HOME,PATH,GITHUB_TOKEN,SENTINEL_SUPERVISOR_TOKEN,SENTINEL_MODEL_BASE_URL,SENTINEL_MODEL_ID,SENTINEL_MODEL_FALLBACK,SENTINEL_DEEPSEEK_API_KEY,SENTINEL_APP_INSTALLATION_ID,UOS_AI_TOKEN,NODE_V8_COVERAGE,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_SHA,GITHUB_WORKFLOW_SHA,GITHUB_WORKFLOW_REF,GITHUB_JOB
          src/host/hosted-runtime.ts

  finalize:
    needs: [prepare, repair]
    if: always() && github.ref == 'refs/heads/sentinel-supervisor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: sentinel-supervisor
    steps:
      - name: Checkout protected supervisor source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Mint the scoped supervisor installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liHUJNXds9mU3j7Q
          private-key: ${{ secrets.SENTINEL_SUPERVISOR_APP_PRIVATE_KEY }}
          owner: ubiquity
          # Every committed target repository the App installation covers. The
          # installation is `repository_selection: all`, but this action still
          # narrows the minted token to the listed names, and a narrowed token
          # is refused with 403 on any repository it does not list. Listing only
          # `sentinel` made every ai.ubq.fi write impossible, which is why no
          # ai.ubq.fi issue could ever be repaired or closed.
          repositories: sentinel,ai.ubq.fi
          permission-contents: write
      - name: Finalize hosted supervisor run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTINEL_SUPERVISOR_TOKEN: ${{ steps.app-token.outputs.token }}
        run: deno task supervisor:run
