# Sentinel repair dispatcher.
#
# Hourly/manual native-token dispatch of the exact protected supervisor ref.
# This workflow holds no App key, no model credential and no runtime code; the
# selected runtime executes in supervisor.yml's repair job with its own
# sentinel-repair concurrency, so dispatch never holds the runtime group.
name: sentinel-repair

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: sentinel-repair-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the exact protected supervisor ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api
          --method POST
          repos/ubiquity/sentinel/actions/workflows/supervisor.yml/dispatches
          -f ref=sentinel-supervisor
