# Sentinel deterministic CI gate (Wave C wiring).
#
# Runs the canonical credential-free harness: formatting, lint, type/build
# check across every module plus the entrypoints, then the complete local
# suite (contracts, state, budget, modules and Wave C integration) in
# credential-free child environments. This is the deterministic branch gate
# required before any aggregate Sentinel PR review/merge; it never calls
# external services.
name: sentinel-ci

on:
  pull_request:
  push:
    branches:
      - master
      - development
      - "codex/**"

permissions:
  contents: read

jobs:
  test-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install hermetic harness system dependencies
        run: |
          # The replay isolation policy resolves fixed system tools, so the
          # runner needs bwrap and a real (non-symlink) /usr/local/bin/deno.
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo install -m755 "$(command -v deno)" /usr/local/bin/deno
          # CI-only: this disposable Ubuntu runner must allow unprivileged
          # user namespaces for bwrap. Never change this on a shared host.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Credential-free local harness
        run: |
          export PATH="/usr/local/bin:$PATH"
          /usr/local/bin/deno task test:local
